name: Scheduled Security

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-and-semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-semver-checks
      - name: Run mutation analysis
        run: |
          mutation_status=0
          cargo mutants --workspace --all-features --in-place --timeout 60 || mutation_status=$?

          if [[ "$mutation_status" -eq 2 ]]; then
            echo "::warning::Mutation analysis found surviving mutants; review the uploaded report."
          elif [[ "$mutation_status" -ne 0 ]]; then
            exit "$mutation_status"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: mutants.out
      - run: cargo semver-checks check-release --workspace

  fuzz-build:
    runs-on: ubuntu-latest
    env:
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz build --target "$FUZZ_TARGET" core_validation
      - run: cargo +nightly fuzz build --target "$FUZZ_TARGET" stripe_webhook
      - run: cargo +nightly fuzz build --target "$FUZZ_TARGET" lipila_webhook
      - run: cargo +nightly fuzz run --target "$FUZZ_TARGET" core_validation -- -runs=1000
      - run: cargo +nightly fuzz run --target "$FUZZ_TARGET" stripe_webhook -- -runs=1000
      - run: cargo +nightly fuzz run --target "$FUZZ_TARGET" lipila_webhook -- -runs=1000

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p payrail --no-default-features

  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
